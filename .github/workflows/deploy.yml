name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/ui-ux-pro-max-install-7gwnnf"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pour activer Shopify : Settings → Secrets and variables → Actions
      # → Variables → ajoute NEXT_PUBLIC_SHOPIFY_DOMAIN et
      # NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN, puis relance le workflow.
      # Aucun changement de code nécessaire.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Marque-s
          # 'mock.shop' = boutique de démo Shopify (checkout de test, aucun
          # débit). Remplacée automatiquement dès que la variable de dépôt
          # NEXT_PUBLIC_SHOPIFY_DOMAIN pointe sur la vraie boutique.
          NEXT_PUBLIC_SHOPIFY_DOMAIN: ${{ vars.NEXT_PUBLIC_SHOPIFY_DOMAIN || 'mock.shop' }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ vars.NEXT_PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ENDPOINT }}
      # Pages ne fait pas tourner Jekyll sur les dossiers _next grâce à .nojekyll
      - run: touch out/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
